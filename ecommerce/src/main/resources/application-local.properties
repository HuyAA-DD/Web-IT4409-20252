# Local override properties - Uses environment variables from .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Security
app.jwt.secret=${JWT_SECRET}

# Google Generative AI
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.project-id=${GOOGLE_PROJECT_ID:gen-lang-client-0307893614}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-pro}
spring.ai.google.genai.chat.options.temperature=${GEMINI_TEMPERATURE:0.7}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
