# ==========================================
# 1. KÍCH HOẠT ĐỌC FILE .ENV (BẮT BUỘC)
# ==========================================
spring.config.import=optional:file:.env

spring.profiles.active=local
spring.application.name=ecommerce

# ==========================================
# 2. DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# 3. JWT CONFIGURATION
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ==========================================
# 4. CLOUDINARY CONFIGURATION
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.upload-folder=ecommerce

# ==========================================
# 5. SEPAY PAYMENT GATEWAY CONFIGURATION
# ==========================================
sepay.api.url=${SEPAY_API_URL}
sepay.webhook-url=${SEPAY_WEBHOOK_URL}
sepay.api-key=${SEPAY_API_KEY}
sepay.webhook-secret=${SEPAY_API_SECRET}
sepay.bank-account-number=${SEPAY_BANK_ACCOUNT_NUMBER}
sepay.bank-name=${SEPAY_BANK_NAME}
sepay.bank-id=${SEPAY_BANK_ID}

# ==========================================
# 6. GEMINI API KEY
# ==========================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY}